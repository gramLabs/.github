name: 'Build Push'
description: 'Builds and pushes a Docker image to GHCR.'
inputs:
  gh-token:
    description: 'PAT used for triggering workflows.'
    required: true
  build-args:
    description: 'Build arguments for the image'
    required: false
    default: ''
  platforms:
    description: 'Target platforms for the image'
    required: false
    default: 'linux/amd64,linux/arm64'
  secrets:
    description: 'BuildKit secrets for the build, one id=value per line. Unlike build-args, they never land in image layers or history.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:

  # Runners are amd64; other platforms build under emulation.
  - uses: docker/setup-qemu-action@v4

  - uses: docker/setup-buildx-action@v4

  - uses: docker/login-action@v4
    with:
      registry: ghcr.io
      username: '${{ github.actor }}'
      password: '${{ github.token }}'

  - uses: docker/metadata-action@v6
    id: meta
    with:
      images: ghcr.io/${{ github.repository }}
      flavor: latest=false
      tags: type=sha

  - uses: docker/build-push-action@v7
    with:
      context: .
      platforms: ${{ inputs.platforms }}
      push: true
      provenance: false
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: type=gha
      cache-to: type=gha
      build-args: ${{ inputs.build-args }}
      secrets: ${{ inputs.secrets }}

  - shell: bash
    env:
      GH_REPO: gramLabs/stormforge-app
      GH_TOKEN: ${{ inputs.gh-token }}
    run: |
      gh workflow run promote_image.yaml -f image="${{ steps.meta.outputs.tags }}" -f ref_name="${{ github.ref_name }}"
