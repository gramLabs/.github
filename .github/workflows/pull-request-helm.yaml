name: Pull Request

on:
  workflow_call:
    inputs:
      check-version-increment:
        description: "Enable or disable the check for a mandatory version change."
        default: true
        required: false
        type: boolean
      check-install:
        description: "Enable or disable installing the chart on a temporary cluster."
        default: true
        required: false
        type: boolean
      run-unit-tests:
        description: "Enable or disable running helm unittest on changed charts."
        default: true
        required: false
        type: boolean

jobs:

  chart-test:
    name: Helm Chart Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Set up Helm Chart Testing
      uses: helm/chart-testing-action@v2

    - name: Run Linter
      run: |
        ct lint --check-version-increment=${{ inputs.check-version-increment }} --target-branch $GITHUB_BASE_REF

    - name: List changed
      id: list-changed
      run: |
        if [[ -n "$(ct list-changed --target-branch $GITHUB_BASE_REF)" ]] ; then
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Install helm-unittest plugin
      if: ${{ inputs.run-unit-tests && steps.list-changed.outputs.changed == 'true' }}
      env:
        HELM_UNITTEST_VERSION: "1.2.1"
        # helm-unittest release signing key. Update only after confirming a key rotation upstream.
        HELM_UNITTEST_KEY_FINGERPRINT: "853008CD0B0A5A2DA04FF8A5616AD47F65B54AC7"
      run: |
        # Helm 4 verifies plugin signatures against a legacy GPG keyring.
        # Build an isolated keyring with only the pinned helm-unittest key.
        export GNUPGHOME="$(mktemp -d)"
        keyring="$RUNNER_TEMP/helm-unittest-pubring.gpg"

        curl -fsSL "https://raw.githubusercontent.com/helm-unittest/helm-unittest/v${HELM_UNITTEST_VERSION}/public-key.asc" \
          | gpg --batch --import

        actual_fingerprint="$(gpg --batch --with-colons --fingerprint | awk -F: '/^fpr:/ {print $10; exit}')"
        if [[ "$actual_fingerprint" != "$HELM_UNITTEST_KEY_FINGERPRINT" ]]; then
          echo "::error::helm-unittest signing key fingerprint mismatch: expected $HELM_UNITTEST_KEY_FINGERPRINT, got $actual_fingerprint"
          exit 1
        fi

        gpg --batch --export "$HELM_UNITTEST_KEY_FINGERPRINT" > "$keyring"

        helm plugin install "oci://ghcr.io/helm-unittest/helm-unittest/unittest:${HELM_UNITTEST_VERSION}" --keyring "$keyring"

    - name: Run unit tests
      if: ${{ inputs.run-unit-tests && steps.list-changed.outputs.changed == 'true' }}
      run: |
        for chart in $(ct list-changed --target-branch $GITHUB_BASE_REF); do
          if [[ -d "$chart/tests" ]]; then
            helm unittest "$chart"
          fi
        done

    - name: Create kind cluster
      uses: helm/kind-action@v1
      if: ${{ inputs.check-install == 'true' && steps.list-changed.outputs.changed == 'true' }}

    - name: Install
      run: ct install --target-branch $GITHUB_BASE_REF
      if: ${{ inputs.check-install == 'true' && steps.list-changed.outputs.changed == 'true' }}
