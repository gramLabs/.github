# main-go-service.yaml
#
# This is the primary shared workflow for building and deploying code on the main branch
# of a "service" project (i.e. one that is continuously deployed).
#
name: Main

on:
  workflow_call:
    inputs:
      build-contexts:
        description: 'List of additional build contexts (e.g., name=path).'
        default: ''
        required: false
        type: string
    secrets:
      gh-token:
        description: 'PAT used for triggering workflows and pulling Go modules.'
        required: true

jobs:

  # Builds and pushes images to GHCR.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: gramLabs/.github/.github/actions/setup-go@main
      with:
        gh-token: ${{ secrets.gh-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Project meta
      id: project-meta
      run: |
        echo "name=$(basename ${PWD})" >> $GITHUB_OUTPUT
        echo "dist_dir_amd64=./dist/$(basename ${PWD})_linux_amd64_v1" >> $GITHUB_OUTPUT
        echo "dist_dir_arm64=./dist/$(basename ${PWD})_linux_arm64_v8.0" >> $GITHUB_OUTPUT
        echo "version=sha-$(git show --quiet --format=%h)" >> $GITHUB_OUTPUT
        echo "commit=$(git show --quiet --format=%H)" >> $GITHUB_OUTPUT
        echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

    - name: Docker meta
      uses: docker/metadata-action@v6
      id: docker-meta
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: latest=false
        tags: |
          type=raw,priority=1100,value=${{ steps.project-meta.outputs.version }}
          type=edge

    - name: Prebuild
      id: prebuild
      run: |
        echo "::group::Define Platform Tags"
        tags=( ${{ steps.docker-meta.outputs.tags }} )
        echo "tags_amd64=$(IFS=,; echo "${tags[*]/%/-amd64}")" >> $GITHUB_OUTPUT
        echo "tags_arm64=$(IFS=,; echo "${tags[*]/%/-arm64}")" >> $GITHUB_OUTPUT
        echo "::endgroup::"
        
        echo "::group::go mod tidy"
        go mod tidy
        echo "::endgroup::"
        
        echo "::group::go generate ./..."
        go generate ./...
        echo "::endgroup::"
        
        echo "::group::go fmt ./..."
        go fmt ./...
        echo "::endgroup::"

    - name: Run Go build (amd64)
      env:
        CGO_ENABLED: "0"
        GOOS: "linux"
        GOARCH: "amd64"
        GOAMD64: "v1"
      run: |
        go build \
          -ldflags "-s '-X=main.version=${{ steps.project-meta.outputs.version }}' '-X=main.commit=${{ steps.project-meta.outputs.commit }}' '-X=main.date=${{ steps.project-meta.outputs.date }}'" \
          -o "${{ steps.project-meta.outputs.dist_dir_amd64 }}/${{ steps.project-meta.outputs.name }}" \
          .

    - name: Run Go build (arm64)
      env:
        CGO_ENABLED: "0"
        GOOS: "linux"
        GOARCH: "arm64"
        GOARM64: "v8.0"
      run: |
        go build \
          -ldflags "-s '-X=main.version=${{ steps.project-meta.outputs.version }}' '-X=main.commit=${{ steps.project-meta.outputs.commit }}' '-X=main.date=${{ steps.project-meta.outputs.date }}'" \
          -o "${{ steps.project-meta.outputs.dist_dir_arm64 }}/${{ steps.project-meta.outputs.name }}" \
          .

    - name: Build and push (amd64)
      uses: docker/build-push-action@v7
      id: build-amd64
      with:
        platforms: linux/amd64
        file: ./Dockerfile
        context: ${{ steps.project-meta.outputs.dist_dir_amd64 }}
        labels: ${{ steps.docker-meta.outputs.labels }}
        build-contexts: ${{ inputs.build-contexts }}
        tags: ${{ steps.prebuild.outputs.tags_amd64 }}
        cache-from: type=gha
        cache-to: type=gha
        push: true
        provenance: false

    - name: Build and push (arm64)
      uses: docker/build-push-action@v7
      id: build-arm64
      with:
        platforms: linux/arm64
        file: ./Dockerfile
        context: ${{ steps.project-meta.outputs.dist_dir_arm64 }}
        labels: ${{ steps.docker-meta.outputs.labels }}
        build-contexts: ${{ inputs.build-contexts }}
        tags: ${{ steps.prebuild.outputs.tags_arm64 }}
        cache-from: type=gha
        cache-to: type=gha
        push: true
        provenance: false

    - name: Create manifest
      run: |
        tags=( ${{ steps.docker-meta.outputs.tags }} )
        digests+=( ${{ steps.build-amd64.outputs.digest }} )
        digests+=( ${{ steps.build-arm64.outputs.digest }} )
        for tag in ${tags[@]} ; do
          docker buildx imagetools create --tag ${tag} ${digests[@]}
        done

    - name: Deploy image
      env:
        GH_REPO: gramLabs/stormforge-app
        GH_TOKEN: ${{ secrets.gh-token }}
      run: |
        tags=( ${{ steps.docker-meta.outputs.tags }} )
        gh workflow run promote_image.yaml -f image="${tags}" -f ref_name="${{ github.ref_name }}"
